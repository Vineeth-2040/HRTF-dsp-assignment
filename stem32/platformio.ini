; PlatformIO project scaffold for STM32
; Replace the board ID below with your exact STM32 board before building.
; Example board IDs:
;   nucleo_f401re
;   bluepill_f103c8
;   disco_f407vg

[env:stm32_target]
platform = ststm32
board = REPLACE_WITH_YOUR_BOARD_ID
framework = arduino
monitor_speed = 115200
upload_protocol = stlink

